<!doctype html>
<html><head><link rel="icon" href="data:,"></head><body>
<main id="bulk-root"></main>
<script>
addEventListener('load', () => setTimeout(() => {
  const fragment = document.createDocumentFragment();
  for (let i = 0; i < 30000; ++i) {
    const element = document.createElement('div');
    element.className = 'bulk-a bulk-b bulk-c';
    element.dataset.bulk = '';
    if (i === 29999) element.classList.add('generic-ad');
    fragment.append(element);
  }
  // One operation, one childList record containing 30,000 added nodes.
  document.getElementById('bulk-root').append(fragment);
}, 150));
</script>
</body></html>
