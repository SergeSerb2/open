<!doctype html>
<html lang="en"><head><base href="/Harness/"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Open Boosts — static.html</title><style>body { margin:0; padding:132px 24px 70px; font:16px system-ui; background:#f7f7fa; color:#202030; } main { max-width:920px; } header, footer { padding:14px; background:#e4e9f5; } #promo-banner { margin:16px 0; padding:20px; background:#ffe8a3; } article { margin:12px 0; padding:14px; background:white; border:1px solid #ccd; } article h2 { margin:0 0 8px; } article p { margin:0; } aside, .x7qz9 { margin:12px 0; padding:18px; background:#e2eedf; } pre, code { font-family:monospace; } #harness-bar { position:fixed; top:8px; left:8px; right:8px; background:#202533; color:white; padding:10px; z-index:2147483646; font:12px system-ui; } #harness-bar button { margin:3px; padding:5px 8px; } #harness-bar a { color:#b9dcff; } #harness-log { max-height:120px; overflow:auto; } #harness-log li { overflow-wrap:anywhere; } #hero-img { width:100px; height:60px; }</style></head><body>
<div id="harness-bar" data-open-zap-ignore>
<nav><a href="loader.html">Loader</a> · <a href="static.html">Static</a> · <a href="spa.html">SPA</a> · <a href="shadow-dom.html">Shadow</a> · <a href="obfuscated.html">Obfuscated</a> · <a href="large.html">20,000 elements</a>
<label><input id="global-enabled" type="checkbox" checked> Enable Boosts</label></nav>
<button id="fixture-F1" onclick="applyFixture('F1')">F1 css+zap</button><button id="fixture-F1b" onclick="applyFixture('F1b')">F1b</button><button id="fixture-F2" onclick="applyFixture('F2')">F2 color+font</button><button id="fixture-F3" onclick="applyFixture('F3')">F3 js</button>
<button id="fixture-shadow" onclick="applyFixture('shadow')">F-shadow</button><button id="fixture-text" onclick="applyFixture('text')">Text controls</button><button id="bad-zap" onclick="applyFixture('bad-zap')">Apply bad-zap plan</button><button id="clear-boosts" onclick="clearBoosts()">Clear</button>
<button id="enter-zap" onclick="enterZap()">Enter Zap</button><button id="undo-zap" onclick="undoZap()">Undo</button><button id="exit-zap" onclick="exitZap()">Exit</button><button id="list-zaps" onclick="listZaps()">List</button><button id="reapply-zaps" onclick="reapplyZaps()">Re-apply with committed zaps</button><button id="perf-hover" onclick="perfHoveredAt()">Perf hoveredAt</button>
<details><summary>Message log</summary><ol id="harness-log"></ol></details></div>
<header id="site-header">20,000 generated elements · obfuscated classes</header>
<main id="content"></main>
<script>
// Exactly 20,000 generated elements: 100 groups × (section + caption + 18 × 11).
const largeContent = document.getElementById("content"), fragment = document.createDocumentFragment();
for (let group = 0; group < 100; group++) {
  const section = document.createElement("section"); section.className = `x7qz9 a1b2c3 group-${group}`;
  const caption = document.createElement("h2"); caption.textContent = `Group ${group}`; section.append(caption);
  for (let item = 0; item < 18; item++) {
    const card = document.createElement("article"); card.className = "a1b2c3 x7qz9"; card.dataset.testid = `card-${group}-${item}`;
    for (let child = 0; child < 10; child++) {
      const node = document.createElement(child === 0 ? "h3" : "span"); node.className = `qz123 child-${child}`;
      node.textContent = child === 0 ? `Card ${group}-${item}` : ` Detail ${child}`; card.append(node);
    }
    section.append(card);
  }
  fragment.append(section);
}
largeContent.append(fragment);
document.documentElement.dataset.generatedElements = largeContent.querySelectorAll("*").length;
</script>
<script>
window.__harness = { messages: [], lastPlan: null, errors: [], armed: null, persistedZaps: new Set(), rejected: [] };
window.addEventListener("error", e => {
  if (/boost-applier|zap-picker/.test(e.filename || "")) window.__harness.errors.push(e.message);
});
window.__open = {
  _handlers: [],
  postMessage(type, payload) {
    const msg = { v: 1, type, payload };
    window.__harness.messages.push(msg);
    // In-page simulation only. Production arms and validates in Swift/isolated world.
    if (/^(zap|picker):/.test(type)) {
      const armed = window.__harness.armed;
      if (!armed || payload.boostID !== armed.boostID || payload.sessionNonce !== armed.sessionNonce) {
        window.__harness.rejected.push(msg); return;
      }
      if (type === "zap:committed") window.__harness.persistedZaps.add(payload.selector);
      if (type === "zap:replaced") { window.__harness.persistedZaps.delete(payload.oldSelector); window.__harness.persistedZaps.add(payload.newSelector); }
      if (type === "zap:removed" && payload.via === "undo") window.__harness.persistedZaps.delete(payload.selector);
      if (type === "zap:revealRequested") {
        window.__harness.persistedZaps.delete(payload.selector);
        send("zap:remove", { ...armed, selector: payload.selector });
        reapplyZaps();
      }
      if (type === "picker:exited") window.__harness.armed = null;
    }
    const li = document.createElement("li");
    li.textContent = type + " " + JSON.stringify(payload).slice(0, 160);
    document.getElementById("harness-log")?.appendChild(li);
  },
  receive(msg) {
    for (const h of window.__open._handlers) { try { h(msg); } catch (e) { console.warn(e); } }
    if (msg.v === 1 && msg.type === "boost:apply") window.__harness.lastPlan = msg.payload;
  },
};
const fixturePlans = {
  F1: { css: "#site-header { outline: 3px solid rgb(255, 0, 0); }", zaps: ["#promo-banner"] },
  F2: { colorAdjustment: { hueRotateDegrees: 90, saturation: 0.5, brightness: 1, contrast: 1, invert: 0 }, fontFamily: "Georgia, serif" },
  F3: { js: 'document.documentElement.dataset.boostJsCount = String(Number(document.documentElement.dataset.boostJsCount || 0) + 1); document.documentElement.setAttribute("data-boost-js", "ran");' },
  shadow: { zaps: ["#shadow-promo"] },
  text: { textZoom: 1.25, textTransform: "uppercase" },
};
fixturePlans.F1b = structuredClone(fixturePlans.F1);
fixturePlans["bad-zap"] = { ...fixturePlans.F1, zaps: ["#promo-banner", "!!!invalid"] };
window.__harness.fixtures = fixturePlans;
function send(type, payload = {}) { window.__open.receive({ v: 1, type, payload }); }
function applyFixture(name) {
  window.__harness.fixtureName = name;
  const f = fixturePlans[name];
  const enabled = document.getElementById("global-enabled").checked;
  send("boost:apply", {
    planID: enabled ? "harness-" + name : "empty",
    boosts: enabled ? [{ boostID: "harness-boost", css: f.css || "", zaps: f.zaps || [] }] : [],
    colorAdjustment: enabled ? f.colorAdjustment || null : null, fontFamily: enabled ? f.fontFamily || null : null,
    textZoom: enabled ? f.textZoom ?? null : null, textTransform: enabled ? f.textTransform ?? null : null,
    js: enabled ? f.js || "" : "",
  });
}
function enterZap() {
  window.__harness.armed ||= { boostID: "harness-boost", sessionNonce: crypto.randomUUID() };
  send("zap:enter", window.__harness.armed);
}
function undoZap() { if (window.__harness.armed) send("zap:undo", window.__harness.armed); }
function exitZap() { if (window.__harness.armed) send("zap:exit", window.__harness.armed); }
function listZaps() {
  if (!window.__harness.armed) return;
  const saved = window.__harness.lastPlan?.boosts.flatMap(b => b.zaps) || [];
  send("zap:list", { ...window.__harness.armed, selectors: [...new Set([...saved, ...window.__harness.persistedZaps])] });
}
function clearBoosts() { send("boost:clear"); }
function reapplyZaps() {
  const zaps = new Set();
  for (const m of window.__harness.messages) {
    if (m.type === "zap:committed") zaps.add(m.payload.selector);
    if (m.type === "zap:replaced") { zaps.delete(m.payload.oldSelector); zaps.add(m.payload.newSelector); }
    if (m.type === "zap:removed" || m.type === "zap:revealRequested") zaps.delete(m.payload.selector);
  }
  send("boost:apply", { planID: "harness-committed", boosts: [{ boostID: "harness-boost", css: "", zaps: [...zaps] }], colorAdjustment: null, fontFamily: null, js: "" });
}
function perfHoveredAt() {
  const targets = [...document.querySelectorAll("article, #promo-banner, #sidebar-ad, .x7qz9")].filter(e => e.getBoundingClientRect().height > 0);
  const values = Array.from({ length: 20 }, (_, i) => {
    const r = targets[i % targets.length].getBoundingClientRect();
    const t = performance.now(); window.__openZap.hoveredAt(r.x + r.width / 2, r.y + r.height / 2);
    return performance.now() - t;
  });
  const sorted = [...values].sort((a,b) => a-b);
  window.__harness.perfHover = { median: (sorted[9] + sorted[10]) / 2, max: sorted[19], values };
  const li = document.createElement("li"); li.textContent = "Perf hoveredAt " + JSON.stringify(window.__harness.perfHover);
  document.getElementById("harness-log").appendChild(li);
}
document.getElementById("global-enabled").addEventListener("change", () => applyFixture(window.__harness.fixtureName || "F1"));
</script>
