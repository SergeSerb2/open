[package]
name = "open-adblock-resources"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
adblock = { version = "=0.8.11", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "resource-assembler"] }
