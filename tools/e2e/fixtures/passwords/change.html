<!doctype html>
<meta charset="utf-8"><title>Open change fixture</title>
<h1>Change fixture</h1>
<form method="post" action="/change">
<label>Username <input id="username" name="username" type="text" autocomplete="username" data-fixture="fixture-user" required></label><br>
<label>Current password <input id="current" name="current" type="password" autocomplete="current-password" data-fixture="fixture-password-1" required></label><br>
<label>New password <input id="password" name="password" type="password" autocomplete="new-password" data-fixture="fixture-password-2" required></label><br>
<button id="submit" type="submit">Submit</button>
</form>
