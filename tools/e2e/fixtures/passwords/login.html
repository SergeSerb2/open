<!doctype html>
<meta charset="utf-8"><title>Open login fixture</title>
<h1>Login fixture</h1>
<form method="post" action="/login">
<label>Username <input id="username" name="username" type="text" autocomplete="username" data-fixture="fixture-user" required></label><br>
<label>Password <input id="password" name="password" type="password" autocomplete="current-password" data-fixture="fixture-password-1" required></label><br>
<button id="submit" type="submit">Submit</button>
</form>
