<!doctype html>
<meta charset="utf-8"><title>Open address fixture</title>
<h1>Address fixture</h1>
<form method="post" action="/address">
<label>Full name <input id="name" name="name" type="text" autocomplete="shipping name" data-fixture="Fixture User" required></label><br>
<label>Street <input id="street" name="street" type="text" autocomplete="shipping street-address" data-fixture="1 Fixture Lane" required></label><br>
<label>City <input id="city" name="city" type="text" autocomplete="shipping address-level2" data-fixture="Exampleville" required></label><br>
<label>Region <input id="region" name="region" type="text" autocomplete="shipping address-level1" data-fixture="CA" required></label><br>
<label>Postal code <input id="postal" name="postal" type="text" autocomplete="shipping postal-code" data-fixture="94043" required></label><br>
<label>Country <input id="country" name="country" type="text" autocomplete="shipping country" data-fixture="US" required></label><br>
<label>Email <input id="email" name="email" type="email" autocomplete="shipping email" data-fixture="fixture@example.com" required></label><br>
<label>Phone <input id="tel" name="tel" type="tel" autocomplete="shipping tel" data-fixture="6505550100" required></label><br>
<button id="submit" type="submit">Submit</button>
</form>
