<p id="other">orbit orbit</p><p id="seed">A short selection</p><p id="long">This selection is longer than forty characters exactly.</p>
<p id="forty">1234567890123456789012345678901234567890</p>
<p id="fortyone">12345678901234567890123456789012345678901</p>

<input id="input" aria-label="Page input"><p id="far">A distant selected paragraph</p>
<script>
window.findKeys=[];addEventListener('keydown',e=>findKeys.push(e.key));
window.selectFindText=(id)=>{let r=document.createRange();r.selectNodeContents(document.getElementById(id));let s=getSelection();s.removeAllRanges();s.addRange(r);return s.toString()};
</script>
