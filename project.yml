# XcodeGen spec for Open. Generate with `tools/build.sh` (or `xcodegen generate`).
# The generated Open.xcodeproj is git-ignored.
name: Open

options:
  bundleIdPrefix: io.github.sergeserb2
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Filled by tools/fetch-cef.sh (CDN build) or tools/fetch-engine.sh (fork).
    CEF_ROOT: $(SRCROOT)/Vendor/cef
    CEF_WRAPPER_LIB: $(CEF_ROOT)/build/libcef_dll_wrapper/libcef_dll_wrapper.a
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Local builds are ad-hoc signed. Release distribution needs a Developer ID
    # identity, ENABLE_HARDENED_RUNTIME=YES, and the per-helper entitlements.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_ENABLE_CPP_RTTI: NO
    GCC_ENABLE_CPP_EXCEPTIONS: NO
    DEAD_CODE_STRIPPING: YES
    # Xcode's product validation rejects CEF's flat framework layout
    # (Info.plist lives in Resources/), and the debug-dylib split would move
    # our code out of the main executable that CEF inspects.
    VALIDATE_PRODUCT: NO
    SKIP_EMBEDDED_FRAMEWORKS_VALIDATION: YES
    ENABLE_DEBUG_DYLIB: NO
    ENABLE_PREVIEWS: NO
  configs:
    Debug:
      # The automation socket (docs/automation.md) is compiled into Debug only,
      # unless OPEN_AUTOMATION=1 is passed to tools/build.sh for Release.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG OPEN_AUTOMATION

packages:
  # Engine-agnostic Swift packages (model, stores, web protocols).
  OpenKit:
    path: Packages/OpenKit
  Sparkle: { url: https://github.com/sparkle-project/Sparkle, exactVersion: 2.10.1 }

targetTemplates:
  CEFHelper:
    type: application
    platform: macOS
    sources:
      - path: Helper/helper_main.mm
    dependencies:
      - target: OpenEngine
        embed: false
    settings:
      base:
        PRODUCT_NAME: "Open Helper${helper_suffix}"
        PRODUCT_BUNDLE_IDENTIFIER: "io.github.sergeserb2.open.helper${bundle_suffix}"
        INFOPLIST_FILE: Helper/Info.plist
        CODE_SIGN_ENTITLEMENTS: "Helper/Entitlements/helper${bundle_suffix}.entitlements"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../.."
        SKIP_INSTALL: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/Engine/OpenEngine/include

targets:
  # The only code that includes CEF headers. A dynamic framework so the main
  # app and the five helper executables share one copy of the engine code and
  # the CEF C++ wrapper (docs/engine-api.md, "Build layout").
  OpenEngine:
    type: framework
    platform: macOS
    sources:
      - path: Engine/OpenEngine/include/OpenEngine
        headerVisibility: public
        buildPhase: headers
      - path: Engine/OpenEngine/src
        headerVisibility: project
    settings:
      base:
        PRODUCT_NAME: OpenEngine
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sergeserb2.open.engine
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        MODULEMAP_FILE: ""
        INSTALL_PATH: "@rpath"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
        HEADER_SEARCH_PATHS: $(CEF_ROOT) $(SRCROOT)/Engine/OpenEngine/include
        GCC_PREPROCESSOR_DEFINITIONS: CEF_USE_SANDBOX=1 __STDC_CONSTANT_MACROS __STDC_FORMAT_MACROS $(inherited)
        OTHER_LDFLAGS: $(CEF_WRAPPER_LIB) -framework AppKit -framework IOSurface -framework QuartzCore
        WARNING_CFLAGS: -Wno-unused-parameter -Wno-shorten-64-to-32 -Wno-comma
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO

  OpenHelper:
    templates: [CEFHelper]
    templateAttributes:
      helper_suffix: ""
      bundle_suffix: ""
  OpenHelperGPU:
    templates: [CEFHelper]
    templateAttributes:
      helper_suffix: " (GPU)"
      bundle_suffix: ".gpu"
  OpenHelperRenderer:
    templates: [CEFHelper]
    templateAttributes:
      helper_suffix: " (Renderer)"
      bundle_suffix: ".renderer"
  OpenHelperPlugin:
    templates: [CEFHelper]
    templateAttributes:
      helper_suffix: " (Plugin)"
      bundle_suffix: ".plugin"
  OpenHelperAlerts:
    templates: [CEFHelper]
    templateAttributes:
      helper_suffix: " (Alerts)"
      bundle_suffix: ".alerts"
    # Web notifications that stay on screen (requireInteraction, progress)
    # come from this helper: alert style, shown as "Open" (page-platform §4.5.2).
    settings:
      base:
        INFOPLIST_FILE: Helper/Info-Alerts.plist

  Open:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Resources/Open.sdef]
      - path: App/Resources/Open.sdef
        buildPhase: resources
    dependencies:
      - target: OpenEngine
        embed: true
      # SwiftPM embeds and signs this binaryTarget automatically. Explicit
      # embed adds a nonexistent Sparkle-product copy with XcodeGen 2.46.
      - package: Sparkle
        product: Sparkle
      - package: OpenKit
        product: OpenModel
      - package: OpenKit
        product: OpenRouting
      - package: OpenKit
        product: OpenStore
      - package: OpenKit
        product: OpenWeb
      - package: OpenKit
        product: OpenExtensionsUI
      - package: OpenKit
        product: OpenBoosts
      - package: OpenKit
        product: OpenSiteControl
      - package: OpenKit
        product: OpenFeatures
      - package: OpenKit
        product: OpenSettings
      - package: OpenKit
        product: OpenCommandBar
      - package: OpenKit
        product: OpenCommands
      - package: OpenKit
        product: OpenScripting
      - package: OpenKit
        product: OpenSuggest
      - package: OpenKit
        product: OpenSidebar
      - package: OpenKit
        product: OpenSpaceEditor
      - package: OpenKit
        product: OpenMedia
      - package: OpenKit
        product: OpenSleep
      - package: OpenKit
        product: OpenDesign
      - package: OpenKit
        product: OpenTranslate
      - target: OpenHelper
        embed: false
        link: false
      - target: OpenHelperGPU
        embed: false
        link: false
      - target: OpenHelperRenderer
        embed: false
        link: false
      - target: OpenHelperPlugin
        embed: false
        link: false
      - target: OpenHelperAlerts
        embed: false
        link: false
    settings:
      base:
        PRODUCT_NAME: Open
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sergeserb2.open
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Open.entitlements
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed CEF framework and helpers
        script: '"$SRCROOT/tools/embed-cef.sh"'
        basedOnDependencyAnalysis: false
