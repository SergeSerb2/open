services:
  open-sync:
    build: .
    image: open-sync-server:1
    restart: unless-stopped
    # Bind to loopback and put a TLS-terminating reverse proxy (Caddy, nginx, Traefik) in front.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      OPEN_SYNC_HOST: "0.0.0.0"
      OPEN_SYNC_PORT: "8787"
      OPEN_SYNC_DATA_DIR: "/data"
      # OPEN_SYNC_MAX_ACCOUNT_BLOB_BYTES: "262144000"
      # OPEN_SYNC_ACCESS_TOKEN_TTL_MS: "3600000"
      # OPEN_SYNC_REFRESH_TOKEN_TTL_MS: "2592000000"
      # OPEN_SYNC_AUTH_RATE_LIMIT: "120"
      # Set to 1 only when running behind a reverse proxy that sets X-Forwarded-For.
      # OPEN_SYNC_TRUST_PROXY: "1"
    volumes:
      - open-sync-data:/data
    stop_grace_period: 15s

volumes:
  open-sync-data:
